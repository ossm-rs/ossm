[package]
name = "modes"
version = "0.1.0"
edition = "2024"

[dependencies]
ossm = { path = "../../core" }
pattern-engine = { path = "../pattern-engine" }
embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.7", default-features = false }
embassy-time = { version = "0.5", default-features = false }
log = "0.4"

[dev-dependencies]
ossm = { path = "../../core", features = ["sim"] }
sim-board = { path = "../../boards/sim-board" }
sim-motor = { path = "../../drivers/sim-motor" }
critical-section = { version = "1.2", features = ["std"] }
static_cell = "2.1.1"
