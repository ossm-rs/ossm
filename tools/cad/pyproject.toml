[project]
name = "ossm-cad"
version = "0.1.0"
description = "Inspect upstream OSSM CAD (STEP) and derive build-guide data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery-ocp>=7.8,<7.9",
    "numpy>=2",
    "scipy>=1.14",
    "pillow>=11",
    "DracoPy>=1.4",
]

[project.scripts]
ossm-cad = "ossm_cad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossm_cad"]
